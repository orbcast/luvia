name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（须已存在，例如 v0.1.0）
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布前先过一遍与 CI 相同的门禁，避免把坏版本推给人下载。
  gate:
    name: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - name: Check app
        run: make check
      - name: Check generated code
        run: make check-gen

  build:
    name: build ${{ matrix.platform }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每个平台用各自的原生 runner 构建：MyGo 的打包步骤会调用平台工具链
          # （macOS 走 actool / codesign，Windows 走 .syso 与安装器），
          # 交叉编译得不到可运行的产物，图标和安装器也会缺。
          - os: macos-14
            platform: darwin/arm64
            artifact: luvia-macos-arm64
          - os: macos-13
            platform: darwin/amd64
            artifact: luvia-macos-amd64
          - os: windows-latest
            platform: windows/amd64
            artifact: luvia-windows-amd64
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: luvia-linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - name: Build
        shell: bash
        working-directory: apps/desktop
        run: go tool mygo build -platform ${{ matrix.platform }}

      # 产物目录名形如 build/darwin-arm64、build/windows-amd64，随平台变化，
      # 所以用 find 找，不猜路径。
      - name: Collect archive
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          archive="$ARTIFACT.zip"
          dir="apps/desktop/build/${PLATFORM%%/*}-${PLATFORM##*/}"
          if [ ! -d "$dir" ]; then
            echo "构建产物目录 $dir 不存在，build/ 内容是：" >&2
            ls -R apps/desktop/build >&2
            exit 1
          fi
          echo "打包 $dir → $archive"
          if command -v zip >/dev/null 2>&1; then
            ( cd apps/desktop/build && zip -ry "$GITHUB_WORKSPACE/$archive" "$(basename "$dir")" )
          else
            # Windows runner 的 bash 里没有 zip，改用 PowerShell 的 Compress-Archive。
            powershell -NoProfile -Command "Compress-Archive -Path '$dir' -DestinationPath '$GITHUB_WORKSPACE/$archive' -Force"
          fi
          ls -la "$archive"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/*.zip dist/SHA256SUMS.txt
