name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（须已存在，例如 v0.2.0）
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布前先过一遍与 CI 相同的门禁，避免把坏版本推给人下载。
  gate:
    name: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - name: Check app
        run: make check
        env:
          # 门禁按真实密钥跑一遍签名用例；这个环境变量不会进产物，
          # 包里的密钥由 build 步骤的 seedpack 封进去。
          KANJU_SECRET: ${{ secrets.KANJU_SECRET }}
      - name: Check generated code
        run: make check-gen

  build:
    name: build ${{ matrix.platform }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两个 Mac 平台都在 Intel 的 macos-15 上出：macos-15-arm64 这条托管队列
          # 长期分不到机器（job 的 runner_name 恒为空，等到 cancel），一个平台不来
          # 就换另一种办法。实测在 Intel 机器上交叉编 darwin/arm64 能出完整的
          # Luvia.app（Mach-O arm64 + Info.plist + luvia-rules），只跳过需要
          # Xcode 26 的 AppIcon.icon 与需要 macOS 的 dmg，而 AppIcon.icns 照旧生成。
          # 代价是未签名，本来就未签名，Gatekeeper 一样要右键打开。
          # 标签里的 arm64 才是 Apple silicon：macos-15 是 Intel 机器。macos-13 已退役。
          - os: macos-15
            platform: darwin/arm64
            artifact: luvia-macos-arm64
          - os: macos-15
            platform: darwin/amd64
            artifact: luvia-macos-amd64
          - os: windows-latest
            platform: windows/amd64
            artifact: luvia-windows-amd64
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: luvia-linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - name: Build
        shell: bash
        working-directory: apps/desktop
        env:
          # 访问密钥随包下发：seedpack 把它封进 resources/kanju.seed，装好即可用。
          # 封装的成本意义见 internal/preferences/seed.go——挡的是「打开文件就能读」，
          # 挡不住有设备控制权的人。LUVIA_SEED_SALT 让每份产物的封口不同，
          # 泄露只属于这一次发版。
          KANJU_SECRET: ${{ secrets.KANJU_SECRET }}
          LUVIA_SEED_SALT: ${{ vars.LUVIA_SEED_SALT }}
          # mygo build 只从 GOFLAGS 取额外 tag，没有自己的 -tags 开关；
          # 少了这一行，二进制用的是 seeddev 的开发盐，封进去的种子在
          # 用户那里会被判成「另一个构建封的」，然后一路请求 401。
          GOFLAGS: -tags=prodseed
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          go run -tags prodseed ./cmd/seedpack -out "$out/kanju.seed"
          go tool mygo build -platform ${{ matrix.platform }}
          dir="build/$(echo '${{ matrix.platform }}' | tr / -)"
          # 种子要落在资源根上，不是规则目录里。mygo.App.Path(PathResources)
          # 返回的是产物目录本身（macOS 上是 Contents/Resources），启动时
          # ApplyAccessKeys 就在那里找 kanju.seed；规则目录是它下面的
          # luvia-rules。放错一层，构建照样绿，运行时却当作没有种子。
          rules="$(find "$dir" -type d -name luvia-rules | head -1)"
          if [ -z "$rules" ]; then
            echo "发布包里没有 luvia-rules，种子无处可放" >&2
            exit 1
          fi
          root="$(dirname "$rules")"
          cp "$out/kanju.seed" "$root/kanju.seed"
          ls -l "$root/kanju.seed" "$rules"

      # 交叉编出来的 arm64 包不经过本机自检，至少要确认二进制真是指令集：
      # 编错了架构在这一步就红，不留到用户那台 Mac 上才炸。
      - name: Verify the binary arch matches
        if: runner.os != 'Windows'
        shell: bash
        working-directory: apps/desktop
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          dir="build/${PLATFORM%%/*}-${PLATFORM##*/}"
          case "$PLATFORM" in
            darwin/*)
              want="${PLATFORM##*/}"
              file "$dir/Luvia.app/Contents/MacOS/Luvia" | tee /dev/stderr | grep -q "$want" \
                || { echo "二进制不是 $want 架构" >&2; exit 1; }
              ;;
          esac

      # 产物目录名形如 build/darwin-arm64、build/windows-amd64，随平台变化，
      # 所以用 find 找，不猜路径。
      - name: Collect archive
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          archive="$ARTIFACT.zip"
          dir="apps/desktop/build/${PLATFORM%%/*}-${PLATFORM##*/}"
          if [ ! -d "$dir" ]; then
            echo "构建产物目录 $dir 不存在，build/ 内容是：" >&2
            ls -R apps/desktop/build >&2
            exit 1
          fi
          echo "打包 $dir → $archive"
          # 不能用 PowerShell 的 Compress-Archive：它把条目名写成反斜杠
          # （windows-amd64\Luvia.exe），多数解压器只认正斜杠，Windows 资源管理器
          # 会解出一堆文件名里带反斜杠的碎片。改用 Go 的 archive/zip，两边一致。
          python3 - "$dir" "$archive" <<'PY'
          import os, sys, zipfile

          source, archive = sys.argv[1], sys.argv[2]
          root = os.path.basename(source.rstrip("/\\"))
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as out:
              for base, dirs, files in os.walk(source):
                  dirs.sort()
                  files.sort()
                  rel = os.path.relpath(base, source)
                  prefix = root if rel == "." else f"{root}/{rel}"
                  prefix = prefix.replace(os.sep, "/")
                  for name in files:
                      path = os.path.join(base, name)
                      out.write(path, f"{prefix}/{name}")
          print(f"{len(zipfile.ZipFile(archive).namelist())} entries written")
          PY
          python3 - "$archive" <<'PY'
          import sys, zipfile

          # 解压器只认正斜杠，发出去的包里不能有反斜杠。
          bad = [n for n in zipfile.ZipFile(sys.argv[1]).namelist() if "\\" in n]
          if bad:
              raise SystemExit(f"archive has backslash entries: {bad[:3]}")
          print("archive paths use forward slashes")
          PY
          ls -la "$archive"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    # 一个平台的 runner 排不上队不该把已经打好的包压着不发：矩阵里任何一条
    # 失败或取消，其余照发，缺口记在发布说明里。
    needs: build
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Note what is missing
        id: missing
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            echo "note=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "note=一次或多平台没有构建成功（build: $RESULT），本页可能缺少某个平台的包，稍后重跑 Release 会补齐。" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          NOTE: ${{ steps.missing.outputs.note }}
        run: |
          set -euo pipefail
          # 已经发过就只补附件：重跑 Release 时不该因为 tag 已用而失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --notes "$NOTE" \
              dist/*.zip dist/SHA256SUMS.txt
          fi
