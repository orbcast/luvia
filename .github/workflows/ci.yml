name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: docs and repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check repository rules
        run: make rules

  app:
    name: apps/desktop checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - name: Check app
        run: make check
      - name: Check coverage
        run: make cover
      - name: Check races
        run: make race
      - name: Check generated code
        run: make check-gen
      - name: Build the app
        run: make build

  cross:
    name: cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - name: Vet for Windows and Linux
        run: |
          cd apps/desktop
          CGO_ENABLED=0 GOOS=windows go vet ./...
          CGO_ENABLED=0 GOOS=linux go vet ./...
